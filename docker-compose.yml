services:
  postgres:
    image: postgres:16
    container_name: knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: knowledge-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - ai_service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai_service:9000

  ai_service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    container_name: knowledge-ai-service
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

  frontend:
    build:
      context: ./frontend
    container_name: knowledge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
